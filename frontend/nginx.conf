# Serves the built app and forwards /api/* to the API container: the same path the Vite dev
# server proxies, so the app's code is identical in both setups.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000/; # the trailing slash drops the /api prefix
    proxy_set_header Host $host;
  }

  # Any other path loads the app, which decides what to show.
  location / {
    try_files $uri /index.html;
  }
}
