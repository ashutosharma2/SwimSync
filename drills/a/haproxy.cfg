# Drill A load balancer: two local API instances behind one address. Local experiment only.

global
    log stdout format iso local0 info

defaults
    mode http
    log global
    # Log errors and health changes, not every successful request.
    option dontlog-normal
    timeout connect 1s
    timeout client  10s
    timeout server  5s
    # No retries or redispatch inside HAProxy: a failed request goes back to the client, as with a
    # cloud load balancer. The client's own retry, with the same idempotency key, is what the drill tests.
    retries 0

frontend swimsync
    bind 127.0.0.1:8080
    default_backend api

backend api
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # Check every second; down after 2 failures in a row, back up after 2 passes.
    default-server inter 1s fall 2 rise 2
    server a1 127.0.0.1:8001 check
    server a2 127.0.0.1:8002 check
