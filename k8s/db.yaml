# PostgreSQL for the local cluster. The data lives in the pod (emptyDir), because every start
# reseeds anyway. The db Service is a ClusterIP, reachable only from inside the cluster, so the
# database trusts connections and no password exists anywhere.
# A read-only role for monitoring (k8s/monitoring/): it can read the statistics views and the
# tables, and can never change a booking. The image runs this file once, when it creates the
# database. The tables don't exist yet at that point (the seed Job creates them, and recreates them
# on every reseed), so the grant is a default for every table the swimsync role creates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: swimsync
data:
  monitor-role.sql: |
    CREATE ROLE monitor LOGIN;
    GRANT pg_monitor TO monitor;
    ALTER DEFAULT PRIVILEGES FOR ROLE swimsync GRANT SELECT ON TABLES TO monitor;
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: swimsync
spec:
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: swimsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:18.6 # the version the drills ran on
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: swimsync
            - name: POSTGRES_USER
              value: swimsync
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - containerPort: 5432
          readinessProbe:
            # Over TCP: during first start the image runs a temporary server on the local socket
            # only, so this succeeds only once the real server is listening.
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "swimsync", "-d", "swimsync"]
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: db-init
