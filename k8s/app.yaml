# The API (two replicas), the outbox worker and the web frontend. Images are copied into the
# cluster with kind load, so every container uses imagePullPolicy: Never.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: swimsync
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: swimsync
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      nodePort: 30080 # published on 127.0.0.1:8089 by k8s/kind-cluster.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: swimsync
spec:
  replicas: 2 # two copies, like drill A's two instances behind HAProxy
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: swimsync-backend:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgresql://swimsync@db:5432/swimsync
            - name: SWIMSYNC_INSTANCE # the X-Instance header then names the pod that answered
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SWIMSYNC_OPERATOR_TOKEN # unset unless the operator Secret exists: every operator request is refused
              valueFrom:
                secretKeyRef:
                  name: operator
                  key: token
                  optional: true
          ports:
            - containerPort: 8000
          lifecycle:
            # A pod told to stop keeps answering for 5 s while the cluster stops routing new
            # connections to it. Without this, the API refuses new connections at once, and a rolling
            # restart refused a booking (nginx answered 502).
            preStop:
              exec:
                command: ["sleep", "5"]
          # /health only says the process can answer, not that the database is up (see app/main.py),
          # so a database outage doesn't take every pod out of the Service at once.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: swimsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: swimsync-backend:latest
          imagePullPolicy: Never
          command: ["python", "scripts/outbox_worker.py"]
          env:
            - name: DATABASE_URL
              value: postgresql://swimsync@db:5432/swimsync
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: swimsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: swimsync-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          lifecycle:
            preStop: # the same pause as the API, for the same reason
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
